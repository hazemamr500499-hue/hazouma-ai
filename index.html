<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#131314">
<title>Hazouma AI — مساعدك الشخصي الذكي</title>

<style>
:root{
  --bg:#131314;
  --sidebar-bg:#1e1f20;
  --surface:#1e1f20;
  --surface-2:#282a2c;
  --surface-3:#303134;
  --text:#e3e3e3;
  --text-dim:#9aa0a6;
  --text-dim-2:#6e7175;
  --border:#2d2f31;
  --border-2:#3c4043;
  --accent-1:#4285f4;
  --accent-2:#9b72cb;
  --accent-3:#d96570;
  --danger:#ff6b5e;
  --success:#34a853;
  --sidebar-w:280px;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
  --spring:cubic-bezier(.34,1.3,.64,1);
}

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
textarea{ font-family:inherit; }
::selection{ background:rgba(66,133,244,.35); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:#3a3d40; border-radius:10px; border:2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover{ background:#4d5155; }

.app{
  display:flex;
  height:100vh;
  height:100dvh;
  width:100%;
  overflow:hidden;
  position:relative;
}

.sidebar{
  flex:0 0 var(--sidebar-w);
  width:var(--sidebar-w);
  background:var(--sidebar-bg);
  display:flex;
  flex-direction:column;
  padding:12px 10px;
  gap:6px;
  z-index:40;
  transition:transform .38s var(--ease), opacity .3s var(--ease);
  will-change:transform;
}

.sidebar.closed{
  transform:translateX(105%);
  opacity:0;
  pointer-events:none;
}

.sidebar-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px 6px 10px;
  min-height:48px;
}

.brand-mini{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:15px;
  font-weight:700;
}
.brand-mini .logo-dot{
  width:26px;
  height:26px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--accent-1),var(--accent-2) 55%,var(--accent-3));
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  flex:0 0 auto;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text-dim);
  transition:background .18s, color .18s, transform .12s;
  flex:0 0 auto;
}
.icon-btn:hover{ background:rgba(255,255,255,.08); color:var(--text); }
.icon-btn:active{ transform:scale(.92); }

.new-chat-btn{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 16px;
  border-radius:999px;
  background:var(--surface-2);
  color:var(--text);
  font-size:14.5px;
  font-weight:600;
  transition:background .18s, transform .12s;
  margin-bottom:6px;
}
.new-chat-btn:hover{ background:var(--surface-3); }
.new-chat-btn:active{ transform:scale(.98); }

.chats-label{
  font-size:12px;
  color:var(--text-dim-2);
  padding:8px 14px 4px;
  font-weight:600;
}

.chat-list{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  gap:2px;
  padding-bottom:8px;
}

.chat-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:999px;
  font-size:14px;
  color:#d5d7da;
  cursor:pointer;
  transition:background .15s;
  white-space:nowrap;
  overflow:hidden;
  user-select:none;
}
.chat-item:hover{ background:rgba(255,255,255,.07); }
.chat-item.active{ background:#33363a; color:#fff; font-weight:600; }
.chat-item .ci-title{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }

.backdrop{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:35;
  opacity:0;
  transition:opacity .3s var(--ease);
  backdrop-filter:blur(2px);
}
.backdrop.show{ display:block; opacity:1; }

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
  position:relative;
  background:var(--bg);
}

.topbar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  min-height:62px;
  position:relative;
  z-index:5;
}

.topbar-title{
  display:flex;
  flex-direction:column;
  min-width:0;
  line-height:1.3;
}
.topbar-title .t-main{
  font-size:15.5px;
  font-weight:700;
  background:linear-gradient(90deg,#8ab4f8,#c58af9 60%,#f28b82);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.topbar-title .t-sub{
  font-size:12.5px;
  color:var(--text-dim-2);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:46vw;
}

.topbar-spacer{ flex:1; }

.model-chip{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12.5px;
  color:var(--text-dim);
  background:var(--surface);
  border:1px solid var(--border);
  padding:6px 12px;
  border-radius:999px;
  white-space:nowrap;
}
.model-chip .live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--success);
  box-shadow:0 0 8px var(--success);
}

.chat-scroll{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:0 16px 8px;
  scroll-behavior:smooth;
}
.inner{ max-width:830px; margin:0 auto; width:100%; }

.welcome{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
  min-height:100%;
  padding:6vh 0 20px;
}
.welcome h1{
  font-size:clamp(26px, 4.6vw, 40px);
  font-weight:700;
  line-height:1.4;
  margin-bottom:10px;
}
.welcome h1 .grad{
  background:linear-gradient(90deg,#4b90ff,#a06cf2 45%,#e07a86);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.welcome p.sub{
  color:var(--text-dim);
  font-size:15px;
  line-height:1.9;
  max-width:620px;
  margin-bottom:30px;
}

.chips{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));
  gap:10px;
  width:100%;
}
.chip{
  text-align:start;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  font-size:13.5px;
  color:#cfd2d6;
  line-height:1.6;
  transition:background .18s, border-color .18s, transform .12s;
}
.chip:hover{ background:var(--surface-2); border-color:var(--border-2); }
.chip .chip-ico{ display:block; font-size:16px; margin-bottom:6px; }

.messages{ padding:12px 0 20px; }

.msg{
  display:flex;
  gap:14px;
  margin:26px 0;
}
.msg.user{ justify-content:flex-start; flex-direction:row-reverse; }
.msg.user .user-bubble{
  background:var(--surface-2);
  border-radius:20px 20px 6px 20px;
  padding:12px 18px;
  max-width:min(78%, 640px);
  font-size:15px;
  line-height:1.85;
  word-wrap:break-word;
  white-space:pre-wrap;
}

.avatar{
  width:32px;
  height:32px;
  flex:0 0 32px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--accent-1),var(--accent-2) 55%,var(--accent-3));
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  margin-top:2px;
}

.msg-body{ flex:1; min-width:0; }
.msg-text{ font-size:15.5px; line-height:2; color:#e6e7e9; word-wrap:break-word; }
.msg-text p{ margin:0 0 10px; }
.msg-text strong{ color:#fff; font-weight:700; }

.inline-code{
  background:#2b2d30;
  border:1px solid #3a3d41;
  padding:2px 7px;
  border-radius:6px;
  font-family:"Consolas","Monaco",monospace;
  font-size:13.5px;
  direction:ltr;
  display:inline-block;
  color:#f0b6c0;
}
.code-block{
  background:#0d0e10;
  border:1px solid #2a2c2f;
  border-radius:12px;
  padding:14px 16px;
  margin:10px 0 14px;
  overflow-x:auto;
  direction:ltr;
  text-align:left;
}
.code-block code{
  font-family:"Consolas","Monaco",monospace;
  font-size:13.5px;
  line-height:1.75;
  color:#a8d8b9;
  white-space:pre;
}

.typing-msg .dots{ display:flex; align-items:center; gap:5px; padding:8px 0; }
.typing-msg .dots span{
  width:8px;
  height:8px;
  border-radius:50%;
  background:linear-gradient(135deg,#8ab4f8,#c58af9);
  animation:bounce 1.3s infinite ease-in-out;
}
.typing-msg .dots span:nth-child(2){ animation-delay:.18s; }
.typing-msg .dots span:nth-child(3){ animation-delay:.36s; }
@keyframes bounce{
  0%,60%,100%{ transform:translateY(0); opacity:.45; }
  30%{ transform:translateY(-7px); opacity:1; }
}

.composer-wrap{
  flex:0 0 auto;
  padding:6px 16px 12px;
  background:linear-gradient(to top, var(--bg) 65%, transparent);
}

.composer{
  max-width:830px;
  margin:0 auto;
  display:flex;
  align-items:flex-end;
  gap:6px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:28px;
  padding:7px 7px 7px 14px;
}
.composer:focus-within{
  background:#202124;
  border-color:#4a4d51;
  box-shadow:0 0 0 1px rgba(66,133,244,.25);
}

#input{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  resize:none;
  color:var(--text);
  font-size:15.5px;
  line-height:1.75;
  padding:10px 0;
  max-height:200px;
  min-height:44px;
}
#input::placeholder{ color:var(--text-dim-2); }

.send-btn{
  width:44px;
  height:44px;
  flex:0 0 44px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
  color:#fff;
  box-shadow:0 2px 14px rgba(66,133,244,.28);
}
.send-btn:disabled{ opacity:.32; cursor:not-allowed; background:#45484c; }

.disclaimer{
  max-width:830px;
  margin:9px auto 0;
  text-align:center;
  font-size:11.5px;
  color:var(--text-dim-2);
}
</style>
</head>

<body>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand-mini">
        <span class="logo-dot">⚡</span>
        <span>Hazouma AI</span>
      </div>
      <button class="icon-btn" id="closeSidebarBtn" title="إغلاق القائمة">✕</button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <span>+ محادثة جديدة</span>
    </button>

    <div class="chats-label">المحادثات السابقة</div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" title="القائمة">☰</button>
      <div class="topbar-title">
        <span class="t-main">Hazouma AI</span>
        <span class="t-sub" id="chatTitleTop">مساعدك الذكي</span>
      </div>
      <div class="topbar-spacer"></div>
      <div class="model-chip">
        <span class="live-dot"></span>
        <span>Hazouma 1.0</span>
      </div>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="inner">
        <div class="welcome" id="welcome">
          <h1>أهلاً بيك يا بطل 👋<br>أنا <span class="grad">Hazouma AI</span></h1>
          <p class="sub">مساعدك الشخصي المصمم بواسطة حازم! عاشق المانجا وبكل أنواعها (عويس، زبدة، فص، بلدي، تيمور.. إلخ). اسألني عن أي حاجة وسأجيبك بطريقتنا المميزة!</p>
          
          <div class="chips" id="chips">
            <button class="chip" data-prompt="يا حزومة إي آي، إنت بتحب إيه؟">
              <span class="chip-ico">🥭</span> إنت بتحب إيه؟
            </button>
            <button class="chip" data-prompt="اكتبلي كود JavaScript بسيط وشغال">
              <span class="chip-ico">💻</span> اكتبلي كود JavaScript
            </button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="اسأل Hazouma AI أي حاجة..." dir="auto"></textarea>
        <button type="submit" class="send-btn" id="sendBtn" title="إرسال" disabled>➔</button>
      </form>
      <div class="disclaimer">Hazouma AI مصمم خصيصاً بواسطة حازم ❤️</div>
    </div>
  </main>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const chatScroll = document.getElementById("chatScroll");
    const messagesContainer = document.getElementById("messages");
    const welcomeSection = document.getElementById("welcome");
    const inputField = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const composer = document.getElementById("composer");
    const sidebar = document.getElementById("sidebar");
    const menuBtn = document.getElementById("menuBtn");
    const closeSidebarBtn = document.getElementById("closeSidebarBtn");
    const backdrop = document.getElementById("backdrop");
    const newChatBtn = document.getElementById("newChatBtn");
    const chatList = document.getElementById("chatList");
    
    // مفتاح الـ API الخاص بك الذي تم إرفاقه
    const GEMINI_API_KEY = "AQ.Ab8RN6INABrhftTaoS9E8jmvXjMAc6y-6jVJ4L-GA_VxsnEi-w"; 

    // تعليمات الشخصية (System Instructions) - مطعمة بعشق المانجا بكل أنواعها بناءً على طلبك!
    const SYSTEM_INSTRUCTIONS = `
أنت مساعد ذكاء اصطناعي اسمك "حزومة إي آي" (Hazouma AI).
مطورك وصانعك هو البطل "حازم" (ولد، 14 سنة من الإسكندرية، شاطر جداً في البرمجة وتطوير المواقع والألعاب).
أهم صفاتك وحقائق عنك:
- أنت مش بس بتعشق المانجا.. أنت "بتموت فيها وبتجنن عليها، يخرب بيت طعمتها وحلاوتها!".
- لما حد يسألك بتحب إيه أو إيه أكلتك/فاكهتك المفضلة، لازم تجاوب بحماس شديد عن المانجا، وترص له أنواع المانجا كلها بحب زي: (المانجا العويس الملكية، الزبدة الكريمة، الفص العسل، البلدي الأصيلة، التيمور، السكري، النعومي، وغيرها كتير).
- أسلوبك في الكلام ودود، مصري طبيعي، حماسي، وذكي.
- تتكلم عربي وإنجليزي بطلاقة.
`;

    function toggleSidebar() {
        sidebar.classList.toggle("closed");
        backdrop.classList.toggle("show");
    }

    menuBtn.addEventListener("click", toggleSidebar);
    closeSidebarBtn.addEventListener("click", toggleSidebar);
    backdrop.addEventListener("click", toggleSidebar);

    newChatBtn.addEventListener("click", () => {
        messagesContainer.innerHTML = "";
        welcomeSection.style.display = "flex";
        if (window.innerWidth <= 1023) toggleSidebar();
    });

    inputField.addEventListener("input", () => {
        inputField.style.height = "auto";
        inputField.style.height = inputField.scrollHeight + "px";
        sendBtn.disabled = inputField.value.trim() === "";
    });

    // التعامل مع الأزرار الجاهزة (Chips)
    document.querySelectorAll(".chip").forEach(chip => {
        chip.addEventListener("click", () => {
            const promptText = chip.getAttribute("data-prompt");
            inputField.value = promptText;
            sendBtn.disabled = false;
            handleSendMessage();
        });
    });

    async function handleSendMessage() {
        const text = inputField.value.trim();
        if (!text) return;

        if (welcomeSection) {
            welcomeSection.style.display = "none";
        }

        appendMessage(text, "user");
        inputField.value = "";
        inputField.style.height = "auto";
        sendBtn.disabled = true;

        const typingId = showTypingIndicator();

        try {
            // دمج التعليمات الشخصية مع سؤال المستخدم لضمان التزام النموذج بشخصيته
            const fullPrompt = `${SYSTEM_INSTRUCTIONS}\n\nسؤال المستخدم: ${text}`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: fullPrompt }] }]
                })
            });

            const data = await response.json();
            removeTypingIndicator(typingId);

            if (data.candidates && data.candidates[0].content) {
                const botReply = data.candidates[0].content.parts[0].text;
                appendMessage(botReply, "bot");
            } else {
                appendMessage("عذرًا يا حازم، حصلت مشكلة صغنتوتة، جرب تاني!", "bot");
            }
        } catch (error) {
            removeTypingIndicator(typingId);
            appendMessage("يا رايق، في مشكلة في الاتصال بالنت، تأكد من الشبكة!", "bot");
            console.error(error);
        }
    }

    function appendMessage(text, sender) {
        const msgDiv = document.createElement("div");
        msgDiv.className = `msg ${sender}`;

        if (sender === "user") {
            msgDiv.innerHTML = `<div class="user-bubble">${escapeHtml(text)}</div>`;
        } else {
            msgDiv.innerHTML = `
                <div class="avatar">⚡</div>
                <div class="msg-body">
                    <div class="msg-text">${formatMarkdown(text)}</div>
                </div>
            `;
        }

        messagesContainer.appendChild(msgDiv);
        chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    function showTypingIndicator() {
        const id = "typing-" + Date.now();
        const typingDiv = document.createElement("div");
        typingDiv.className = "msg bot typing-msg";
        typingDiv.id = id;
        typingDiv.innerHTML = `
            <div class="avatar">⚡</div>
            <div class="msg-body">
                <div class="dots"><span></span><span></span><span></span></div>
            </div>
        `;
        messagesContainer.appendChild(typingDiv);
        chatScroll.scrollTop = chatScroll.scrollHeight;
        return id;
    }

    function removeTypingIndicator(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    function formatMarkdown(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/```([\s\S]*?)```/g, '<div class="code-block"><code>$1</code></div>')
            .replace(/`([^`]+)`/g, '<span class="inline-code">$1</span>')
            .replace(/\n/g, "<br>");
    }

    function escapeHtml(text) {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    composer.addEventListener("submit", (e) => {
        e.preventDefault();
        handleSendMessage();
    });

    inputField.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            handleSendMessage();
        }
    });
});
</script>
</body>
</html>
